substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: oingg-gov
  _SERVICE: oingg-gov-ts

steps:
  # 測試/型別檢查/lint 關卡：這三個沒過，後面的 image build/deploy 都不會執行（Cloud Build steps 依序失敗即中止）。
  - id: test
    # 跟 Dockerfile、CI 同一個 Node 大版本（2026-10-13 升 26 時漏改了這裡，10/14 補上）：正式環境跑 26，
    # 部署前唯一的關卡卻在 22 上測，用到 26 才有的東西就測不出來。
    name: node:26-trixie-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # postinstall（pnpm install 觸發）本身就會跑 prisma generate，不是只有下面那行手動呼叫的——
        # 兩者都需要 DIRECT_URL 才能讓 prisma.config.ts 解析成功（不需要真的連得上，只要變數存在），
        # 所以要在 pnpm install 之前就 export，不能只放在最後一行手動呼叫前面。
        export DIRECT_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"
        npm install -g pnpm@11.28.9 # 跟 package.json 的 packageManager 同一版，理由見 Dockerfile
        pnpm install --frozen-lockfile
        npx prisma generate
        pnpm test
        npx tsc --noEmit
        pnpm lint --deny-warnings

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app

  # 部署前先等同一個觸發條件裡比這次早建立、還在跑的建置（使用者 2026-11-19：能自動化就自動化；照管理站 9acf9e7）。
  # 連推兩次、建置重疊時，較早的那次如果比較晚部署完，to-latest 會把流量切回舊程式、prd 標籤停在舊映像、部署紀錄的順序也會亂。
  # 每 20 秒查一次、最多 20 分鐘；逾時或查詢失敗都照樣部署，不擋上線。手動 gcloud builds submit 沒有觸發條件，不等。
  # test、build、push 不用等，跟較早的建置平行跑。查建置用的是 cloud-build-deployer 本來就有的 cloudbuild.builds.builder；
  # 觸發條件 deploy-on-push-to-main 在 global，不用帶 --region。最多等 20 分鐘，所以 build 的 timeout 調成 1800s（檔案最下面）。
  - id: wait-earlier-builds
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        me=$$(gcloud builds describe ${BUILD_ID} --format='value(createTime,buildTriggerId)') || { echo "查不到這次建置的資料，不等"; exit 0; }
        read -r created trigger <<< "$$me"
        [ -n "$$trigger" ] || { echo "不是觸發條件啟動的建置，不等"; exit 0; }
        for i in $$(seq 60); do
          earlier=$$(gcloud builds list --ongoing --verbosity=error --filter="buildTriggerId=$$trigger AND createTime<'$$created'" --format='value(id)') || { echo "查不到較早的建置，照樣部署"; exit 0; }
          [ -z "$$earlier" ] && exit 0
          echo "等較早的建置跑完：$$earlier"
          sleep 20
        done
        echo "等了 20 分鐘還有較早的建置在跑，照樣部署"

  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
      - --region=${_REGION}
      - --min-instances=0
      # 最多一台：src/shared/rateLimiter.ts 的 in-flight 鎖和冷卻都在單台記憶體裡，多台時兩次觸發
      # 落在不同台就擋不住，同一個 dataset 會被同時跑兩次（analysis-ts review 2026-10-22；原本
      # maxScale 是 20，近 30 天一個 revision 用過 18 台）。流量只有錯開時間的排程 ingest，一台夠。
      - --max-instances=1
      - --no-allow-unauthenticated
      # 執行身分只能讀那兩個 secret、寫 log（2026-11-09）：原本沿用預設 compute 服務帳號，帶著 run.admin、
      # 專案層級 iam.serviceAccountUser 和 artifactregistry.writer，程式被打穿就能重新部署、冒用專案裡的
      # 任何服務帳號。2026-11-11 起多了銅層 bucket oingg-gov-bronze 的 objectCreator + objectViewer（只能
      # 新增和讀，不能覆寫或刪除），這是程式唯一呼叫的 GCP API。
      - --service-account=gov-ts-runtime@$PROJECT_ID.iam.gserviceaccount.com
      # 所有 ingest 都在秒級完成，用 Cloud Run 預設的 300 秒逾時，比 Scheduler 的 attemptDeadline（180s）長。
      # 原本設到上限 3600 秒是給跑很久的端點（refresh-tracked 約 17 分鐘、下載 322MB 稅籍檔的兩支），
      # 2026-10-07 和 2026-11-13 都刪掉了。300 要寫出來：deploy 沒帶 --timeout 會沿用上一版的 3600。
      # Request-based billing（預設、沒有 --no-cpu-throttling）就夠：這個服務沒有請求之外還需要跑的背景工作。
      - --timeout=300
      # 記憶體：兩個上限一定要一起設，只調一邊等於把一種 OOM 換成另一種（2026-09-24 sitca-ts
      # 實測並廣播）。--memory 管容器 RSS；NODE_OPTIONS 的 --max-old-space-size 管 V8 old-space，
      # 而 V8 預設是從容器記憶體推算（約一半），所以調大 --memory 不會讓 heap 跟著變大——
      # sitca-ts 的 1Gi 容器在只用到 55% 時就因為 heap 撞到 523MB 而死。
      #
      # 這裡原本兩個都沒設，等於吃 Cloud Run 預設 512Mi、heap 天花板約 256MB。gov-ts 本機實測
      # （2026-09-24）：monthly-unemployment-rate 這支 12,055 列的 job 連跑三次，RSS 就到 476MB，
      # 而排程是 8 支 job 每 5 分鐘一支、同一個暖 instance 連續吃下來，記憶體只升不降。
      # 768 + 2Gi 是 sitca-ts 實測穩定的組合，直接沿用。
      - --memory=2Gi
      - --set-secrets=DATABASE_URL=gov-database-url:latest,TASK_SECRET=gov-task-secret:latest
      # BRONZE_BUCKET：每次抓到的原始回應存在這裡（shared/bronze.ts）。沒設的話匯入照常，但每次都記
      # [bronze-write-failed]，bronze_write_failures 告警會響。
      - --set-env-vars=NODE_ENV=production,NODE_OPTIONS=--max-old-space-size=768,BRONZE_BUCKET=oingg-gov-bronze
      - --quiet

  # 退版是把流量釘在上一個 revision（update-traffic --to-revisions=<上一版>=100）。釘住之後新部署的 revision
  # 拿不到流量，build 卻照樣成功（官方文件：all subsequent deployments use that traffic split pattern going
  # forward）。push main 就是要上線，所以每次都切回最新版（2026-11-11）。放在 tag-prd 前面，prd 標籤才會標在
  # 真的接流量的映像上。
  - id: to-latest
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_SERVICE}
      - --to-latest
      - --region=${_REGION}
      - --quiet

  # 部署成功才走到這步（步驟依序執行，deploy 失敗整個 build 就停）：把正式站正在用的映像標成 prd。
  # Artifact Registry 的清理規則（scripts/artifact-cleanup-policy.json）是保留最近 10 個，另有 Keep tagPrefixes [prd]——
  # push 在 deploy 之前，連續部署失敗會把正式站的映像擠出保留名額，沒有這個標籤就會被清掉、下次冷啟動起不來
  # （2026-10-27）。保留數 2026-11-11 從 2 調成 10：只留 2 個時，切流量退版只退得回上一版。
  # 用 docker tag + push，不用 gcloud artifacts docker tags add：後者移動既有標籤要 artifactregistry.tags.delete，
  # 建置身分的 artifactregistry.writer 沒有（twse-ts 實測 PERMISSION_DENIED）；docker push 移動標籤只要 writer，
  # 跟每次移動 latest 同一條路。
  - id: tag-prd
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker tag ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:prd && docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:prd

  # 部署成功後在業務中台登記部署紀錄（2026-11-18 使用者核准，照櫃買 tpex-ts）：原本每次部署後要用使用者帳號在本機跑，登入 16 小時就過期。
  # 登記失敗不擋部署（allowFailure），要看這一步的輸出；失敗時照 README 的「Deploy records」在本機重跑同一個指令，PRD 不會重複登記。
  # 只有 main 會觸發，記 prd（腳本另寫一份到 DEV 總帳）；手動 gcloud builds submit 沒有分支，跳過。
  # 權限：oingg-business 的 DEPLOY_RECORD_KEY_PRD／_DEV、GITHUB_READ_TOKEN 的 secretAccessor 和業務中台 PRD／DEV 的 run.invoker（業務中台開），
  # 加上 cloud-build-deployer 對自己的 roles/iam.serviceAccountOpenIdTokenCreator：Cloud Build 裡拿不到 ID token，腳本改用 IAM Credentials API 幫自己簽。
  # 用 cloud-sdk 映像是因為腳本要 gcloud；它的 apt 給的 Node 夠新。工作區是淺層 clone，上次部署的 commit 不在歷史裡時腳本改問 GitHub compare。
# revision 用這次映像的 digest 找，不用 latestReadyRevisionName：兩次建置重疊時，先開始的那次會把後一次的 revision 記成自己的 commit
#（櫃買 2026-11-19 DEV 實例，tpex a9ca51c）。revision 的 spec 存的是 @sha256 digest 不是標籤；--limit 會先套用再篩，所以用 head -1。找不到就不登記。
  - id: record-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    allowFailure: true
    args:
      - -c
      - |
        set -e
        if [ "${BRANCH_NAME}" != main ]; then echo "分支「${BRANCH_NAME}」不登記部署紀錄"; exit 0; fi
        apt-get -qq update >/dev/null && apt-get -qq install -y nodejs >/dev/null
        git config --global --add safe.directory /workspace
        DIGEST=$$(gcloud artifacts docker images describe ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA --format='value(image_summary.digest)')
        [ -n "$$DIGEST" ] || { echo "讀不到 app:$SHORT_SHA 的 digest，不登記"; exit 1; }
        REVISION=$$(gcloud run revisions list --service=${_SERVICE} --region=${_REGION} --filter="spec.containers.image:$$DIGEST" --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)' | head -1)
        [ -n "$$REVISION" ] || { echo "找不到 $$DIGEST 的 revision，不登記"; exit 1; }
        node tools/record-deploy.mjs --service gov-ts --environment prd --revision "$$REVISION" --commit ${SHORT_SHA} --repo oingg-tw/oingg-gov-ts

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest

# trigger 用自建 service account 時，Cloud Build 要求要嘛指定 logs_bucket，要嘛用這個選項把 log
# 直接送進 Cloud Logging（不落地 GCS 暫存桶）——手動 gcloud builds submit 沒這個限制，一路走到
# 建 GitHub trigger 這步才會擋（見 oingg-conductor-ts/docs/production-deployment.md）。
options:
  logging: CLOUD_LOGGING_ONLY

# 預設 10 分鐘不夠：wait-earlier-builds 最多等 20 分鐘，加上平常約 5 分鐘的建置。照實際用掉的分鐘計費。
timeout: 1800s
