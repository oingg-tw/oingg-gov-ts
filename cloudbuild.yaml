substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: oingg-gov
  _SERVICE: oingg-gov-ts

steps:
  # 測試/型別檢查/lint 關卡：這三個沒過，後面的 image build/deploy 都不會執行（Cloud Build steps 依序失敗即中止）。
  - id: test
    name: node:22-trixie-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # postinstall（pnpm install 觸發）本身就會跑 prisma generate，不是只有下面那行手動呼叫的——
        # 兩者都需要 DIRECT_URL 才能讓 prisma.config.ts 解析成功（不需要真的連得上，只要變數存在），
        # 所以要在 pnpm install 之前就 export，不能只放在最後一行手動呼叫前面。
        export DIRECT_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"
        npm install -g pnpm@11
        pnpm install --frozen-lockfile
        npx prisma generate
        pnpm test
        npx tsc --noEmit
        pnpm lint

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app

  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
      - --region=${_REGION}
      - --min-instances=0
      - --no-allow-unauthenticated
      # 那幾個跑很久的 ingest 端點（refresh-tracked 實測約 17 分鐘、company-industry-classification
      # 要下載 322MB）遠超 Cloud Run 預設的 300 秒逾時，設到上限 3600 秒。Request-based billing
      # （預設、沒有 --no-cpu-throttling）就夠：這個服務沒有請求之外還需要跑的背景工作。
      - --timeout=3600
      # 記憶體：兩個上限一定要一起設，只調一邊等於把一種 OOM 換成另一種（2026-09-24 sitca-ts
      # 實測並廣播）。--memory 管容器 RSS；NODE_OPTIONS 的 --max-old-space-size 管 V8 old-space，
      # 而 V8 預設是從容器記憶體推算（約一半），所以調大 --memory 不會讓 heap 跟著變大——
      # sitca-ts 的 1Gi 容器在只用到 55% 時就因為 heap 撞到 523MB 而死。
      #
      # 這裡原本兩個都沒設，等於吃 Cloud Run 預設 512Mi、heap 天花板約 256MB。gov-ts 本機實測
      # （2026-09-24）：monthly-unemployment-rate 這支 12,055 列的 job 連跑三次，RSS 就到 476MB，
      # 而排程是 8 支 job 每 5 分鐘一支、同一個暖 instance 連續吃下來，記憶體只升不降。
      # 768 + 2Gi 是 sitca-ts 實測穩定的組合，直接沿用。
      - --memory=2Gi
      - --set-secrets=DATABASE_URL=gov-database-url:latest,TASK_SECRET=gov-task-secret:latest
      - --set-env-vars=NODE_ENV=production,NODE_OPTIONS=--max-old-space-size=768
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest

# trigger 用自建 service account 時，Cloud Build 要求要嘛指定 logs_bucket，要嘛用這個選項把 log
# 直接送進 Cloud Logging（不落地 GCS 暫存桶）——手動 gcloud builds submit 沒這個限制，一路走到
# 建 GitHub trigger 這步才會擋（見 oingg-conductor-ts/docs/production-deployment.md）。
options:
  logging: CLOUD_LOGGING_ONLY
