# CI（2026-10-13）。兩個用途：每個 PR 都有建置＋測試的結果可看，以及 Dependabot 自動合併的前提——
# cooldown 擋的是惡意版本，擋不了「合法但改壞 API 的版本」，那只有建置＋測試抓得到。
# 範本是 oingg-mops-ts/.github/workflows/ci.yml。
#
# checks：lint（oxlint）→ build（tsc + tsc-alias，tsc 就是型別檢查）→ test（vitest）→ 啟動煙霧測試。
# 單元測試是 parser 測試，不碰資料庫。但煙霧測試要真的連得上資料庫：connectDb() 啟動時跑 SELECT 1，
# 連不上就拒絕啟動（2026-10-13 起；之前 Prisma 7 搭 driver adapter 的 $connect() 不會真的連線，資料庫
# 掛了也照樣印「已連線」），所以 services 起一個空的 Postgres 18（跟正式環境 Neon 同一個大版本）。
# 不跑 migration、不需要任何表：煙霧測試只驗「原生檔載得起來＋連得上資料庫＋listen 完成」。
# Node 26、pnpm 11 都跟 Dockerfile 一致（uWebSockets.js 綁 Node ABI）。
#
# dependabot-merge：needs: checks，同一次執行裡 checks 通過才會跑；只合 Dependabot 開到 development、
# 而且不是 semver-major 的 PR，用 --match-head-commit 只合剛驗證過的那個 commit。
# - minor 也放行：minor＋patch 合成一個群組 PR，fetch-metadata 回報群組裡最大的等級，只放 patch 的話
#   群組 PR 永遠不會自動合。
# - development 不接部署（Cloud Build 只接 main），所以自動合併不會觸發上線；main 一律由人合。
# - 安全要點：用 pull_request（不是 pull_request_target）、作者用 pull_request.user.login 判斷（不是
#   github.actor）、寫入權限只給這個 job、這個 job 不 checkout 也不執行 PR 的程式碼。
name: CI

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile # postinstall 會跑 prisma generate
      # --deny-warnings：oxlint 預設只有 error 會讓它失敗，像 no-debugger 這類是 warning、exit 0 照樣綠燈
      # （2026-10-13 乾淨 worktree 預演時故意放一個 debugger 實測過）。目前 0 個 warning，所以把 warning
      # 也當失敗，lint 才真的有把關作用。
      - run: pnpm run lint --deny-warnings
      - run: pnpm run build
      - run: pnpm test
      # 單元測試不會啟動伺服器：升 Node 或升 uWebSockets.js 時原生檔載不起來，前面每一步照樣綠燈，要到部署才炸
      # （twse-ts 的 uWS 20.48.0 在 Node 26 上就是這樣）。GET / 回傳的啟動時間是在 listen 完成之後才設定的，
      # 所以它回 200 而且帶「數字ms」才算真的起來；順便把啟動時間印進 log，升級時看得出有沒有變慢。
      # 2026-10-13 本機預演：沒有資料庫、密碼錯、路徑不存在三種情況這一步都會失敗。
      - name: 啟動煙霧測試
        shell: bash
        run: |
          PORT=18080 node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:18080/) && echo "$body" | grep -qE '[0-9]+(\.[0-9]+)?ms' && { echo "伺服器起得來：$body"; exit 0; }
            sleep 1
          done
          echo "::error::伺服器 30 秒內沒有回應（或 GET / 沒有回報啟動時間）"; cat server.log; exit 1

  dependabot-merge:
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
