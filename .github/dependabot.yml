version: 2
updates:
  - package-ecosystem: "npm" # pnpm-lock.yaml 也吃這個 ecosystem key，Dependabot 支援 pnpm workspace
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # zod 跟 zod-to-openapi 版本互相牽制（2026-09-04 才把 zod-to-openapi 從 7.3.4 升到 9.1.0，
      # 連帶把 zod 從 3 升到 4——9.x 的 peer 要求 zod ^4.0.0）。分到同一組讓 Dependabot 只開「兩個
      # 一起升」的 PR，不用 ignore 規則整個擋掉更新（那樣連安全性修補都收不到）。
      zod:
        patterns:
          - "zod"
          - "@asteasolutions/zod-to-openapi"
      # 同樣道理：@prisma/client、@prisma/adapter-pg、prisma（CLI）三個套件版本必須完全一致，
      # 混版本會在執行期出錯，不是型別層級的問題，分開升級風險很高。
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
          - "@prisma/adapter-pg"
      # vitest 跟 @vitest/coverage-v8 也必須版本一致（2026-09-04 裝 coverage-v8 時已確認：裝
      # @latest 會抓到比 vitest 新的版本、造成 peer 不相容）。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      # 其餘套件的 minor／patch 合成一個 PR（生態系 2026-10-13 對齊的做法），major 各自一個 PR。
      # Dependabot 把每個套件分到「第一個符合的組」，所以這組要放最後：上面三組版本連動的套件不會被
      # 拆進來。
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dockerfile 的 base image（node）。跟 npm 同一個節奏。
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node major（22 → 24）不自動開 PR：ultimate-express 依賴的 uWebSockets.js 是 native module，
      # 綁 Node ABI（見 Dockerfile 檔頭），換 major 要先確認它有對應版本的 binary，是一次刻意的升級，
      # 不是例行更新。22 版內的 minor／patch 照收（安全修補在這裡）。
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
